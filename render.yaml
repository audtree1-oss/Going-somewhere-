# Render blueprint for Going Somewhere! — Node/Express + SQLite on a
# persistent disk. Same proven architecture as Erica HQ / Life Wrangler.
services:
  - type: web
    name: going-somewhere
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: going-somewhere-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /data
      # Powers the AI trip assistant ("find stops between Kingman and
      # Flagstaff"). The app works without it — the assistant just
      # explains it needs a key.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Password-reset emails (resend.com; free tier is plenty). Without
      # it, the app owner can still mint reset links using
      # ADMIN_RESET_SECRET — see docs/USER-MANUAL.md.
      - key: RESEND_API_KEY
        sync: false
      # Secret for the owner's manual reset-link fallback. Auto-generated;
      # find it in the Render dashboard under Environment.
      - key: ADMIN_RESET_SECRET
        generateValue: true
